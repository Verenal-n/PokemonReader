<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Читальний Світ — Покемон</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:#16213e;position:relative;overflow:hidden;}
.screen{display:none;height:100%;flex-direction:column;}.screen.active{display:flex;}

/* SELECT */
.sel-bg{background:url('start.png') center top/cover no-repeat;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 1rem calc(6rem + env(safe-area-inset-bottom, 0px));overflow-y:auto;}
.sel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.sel-card{background:rgba(10,15,35,.72);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px);border-radius:16px;padding:1.25rem .75rem;cursor:pointer;text-align:center;transition:all .2s;}
.sel-card:hover{background:rgba(255,255,255,.14);transform:translateY(-2px);}
.sel-av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px;overflow:hidden;}
.sel-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:3px;}
.sel-sub{font-size:10px;color:#7eceff;margin-bottom:5px;}
.spill{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;background:rgba(126,206,255,.15);color:#7eceff;display:inline-block;margin:2px 1px;}

/* HEADER */
.hdr{background:rgba(0,0,0,.45);padding:9px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
.back-btn{background:none;border:none;cursor:pointer;font-size:18px;color:#7eceff;padding:2px 6px;}
.hdr-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden;}
.hdr-info{display:none;}
.hdr-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-loc{font-size:10px;color:#7eceff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-res{display:flex;gap:4px;flex-shrink:0;flex-wrap:nowrap;justify-content:flex-end;margin-left:auto;}
.rpill{background:rgba(255,255,255,.1);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;color:#fff;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;}
.rpill-menu{padding:7px 13px;font-size:16px;line-height:1;background:rgba(45,212,191,.22);border:1px solid rgba(45,212,191,.45);}
.rpill:hover{background:rgba(255,255,255,.2);}

/* MAIN CONTENT */
.main-content{flex:1;overflow-y:auto;padding:10px;min-height:0;}
.tab-page{height:100%;}

/* BOTTOM TABS */
.bottom-tabs{display:flex;flex-shrink:0;background:rgba(0,0,0,.5);border-top:1px solid rgba(255,255,255,.08);}
.bottom-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 calc(6px + env(safe-area-inset-bottom,0px));background:none;border:none;color:#777;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;}
.bottom-tab .bt-icon{font-size:19px;line-height:1;}
.bottom-tab.act{color:#7eceff;}

/* DEX */
.sec-title{font-size:10px;font-weight:600;color:#7eceff;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.dex-grid{display:flex;flex-direction:row;overflow-x:auto;gap:6px;margin-bottom:10px;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent;}
.dex-grid::-webkit-scrollbar{height:3px;}.dex-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.dex-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:0 3px 5px;text-align:center;cursor:pointer;transition:all .15s;overflow:hidden;width:68px;flex-shrink:0;position:relative;}
.dex-card:hover{background:rgba(255,255,255,.1);}
.dex-img{width:calc(100% + 6px);height:68px;object-fit:contain;object-position:bottom center;image-rendering:pixelated;margin:0 -3px;display:block;}
.dex-name{font-size:8px;color:#ccc;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;}
.dex-sub{font-size:8px;color:#7eceff;line-height:1.2;}
.dex-empty{flex:1;text-align:center;padding:.6rem;color:rgba(255,255,255,.25);font-size:12px;}
.chain-row{display:flex;flex-direction:row;overflow-x:auto;gap:6px;margin-bottom:10px;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent;}
.chain-row::-webkit-scrollbar{height:3px;}.chain-row::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.chain-block{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.35);border-radius:10px;padding:5px 8px 5px 6px;display:flex;align-items:center;gap:2px;position:relative;flex-shrink:0;overflow:hidden;}
.chain-block-badge{position:absolute;top:0;right:0;background:#fbbf24;color:#000;font-size:6px;font-weight:700;padding:1px 5px;border-radius:0 8px 0 5px;letter-spacing:.04em;}
.chain-sprite{cursor:pointer;text-align:center;flex-shrink:0;opacity:.9;transition:opacity .15s;}
.chain-sprite:hover{opacity:1;}
.chain-arrow{color:rgba(251,191,36,.5);font-size:11px;flex-shrink:0;line-height:1;margin-top:-6px;}

/* MAP */
.map-card{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;margin-bottom:8px;}
#map-region-tabs{background:rgba(0,0,0,.2);}
.map-svg{display:block;width:100%;}

/* ACTIONS */
.act-card{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;margin-bottom:8px;}
.act-hdr{display:flex;flex-direction:row;align-items:center;text-align:left;gap:10px;padding:8px 12px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.05);}
.act-hdr-emoji{font-size:18px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}.act-hdr-emoji img{width:38px;height:38px;border-radius:50%;object-fit:cover;}
.act-hdr-info{flex:1;min-width:0;}
.act-hdr-name{font-size:13px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.act-hdr-desc{font-size:10px;color:#7eceff;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.act-hdr-badge{font-size:9px;font-weight:600;padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap;}
.act-list{padding:10px;}
.act-row{display:flex;align-items:center;gap:8px;padding:9px 10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);border-radius:10px;cursor:pointer;transition:all .15s;}
.act-row:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.12);}
.act-icon{font-size:18px;flex-shrink:0;}
.act-body{flex:1;}
.act-title{font-size:12px;font-weight:600;color:#fff;}
.act-desc{font-size:10px;color:#888;margin-top:1px;}
.act-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0;}

/* CATCH BUTTON */
.catch-btn{width:100%;padding:16px;font-size:15px;font-weight:700;border-radius:14px;border:none;cursor:pointer;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;}
.catch-btn:hover{filter:brightness(1.1);}
.catch-btn.done{background:rgba(74,222,128,.13);color:#4ade80;cursor:default;border:1px solid rgba(74,222,128,.3);}
.catch-btn.done:hover{filter:none;}
.catch-cost{font-size:12px;opacity:.9;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:10px;}

/* GOAL WIDGET */
.goal-widget-inner{padding:10px 12px 12px;text-align:center;}
.goal-tabs{display:flex;gap:6px;margin-bottom:8px;background:rgba(0,0,0,.25);border-radius:20px;padding:3px;}
.goal-tab{flex:1;padding:5px 0;font-size:11px;font-weight:600;border-radius:16px;border:none;background:transparent;color:#888;cursor:pointer;font-family:inherit;}
.goal-tab.act{background:#2a3550;color:#fff;}
.goal-gauge-wrap{position:relative;width:100%;max-width:190px;margin:0 auto;}
.goal-gauge-svg{display:block;width:100%;}
.goal-gauge-center{position:absolute;left:0;right:0;top:38%;text-align:center;}
.goal-gauge-label{font-size:9px;font-weight:700;letter-spacing:.06em;color:#999;}
.goal-gauge-value{font-size:22px;font-weight:800;color:#fff;line-height:1.1;}
.goal-action-btn{margin-top:4px;padding:8px 20px;font-size:12px;font-weight:600;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.35);border-radius:20px;color:#fbbf24;cursor:pointer;font-family:inherit;}

/* STATS TAB */
.stats-sub-hdr{font-size:15px;font-weight:700;color:#fff;margin-bottom:8px;}
.stats-divider{height:1px;background:rgba(255,255,255,.08);margin:16px 0;}
.stat-tiles{display:flex;gap:8px;margin:10px 0;}
.stat-tile{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 6px;text-align:center;}
.stat-tile-val{font-size:20px;font-weight:800;color:#fff;line-height:1.1;}
.stat-tile-lbl{font-size:10px;color:#888;margin-top:2px;}
.stats-chart-card{position:relative;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px;margin-top:4px;}
.stats-chart-tooltip{position:absolute;transform:translate(-50%,calc(-100% - 8px));background:#fff;color:#1e2d4a;font-size:12px;font-weight:800;padding:3px 9px;border-radius:7px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:5;}
.stats-chart-tooltip::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff;}
.stats-chart-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;}
.stats-year-sel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:12px;padding:4px 8px;font-family:inherit;}
.stats-metric-tabs{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:14px;padding:3px;}
.stats-metric-tab{padding:4px 7px;font-size:10px;font-weight:600;border-radius:10px;border:none;background:transparent;color:#888;cursor:pointer;font-family:inherit;white-space:nowrap;}
.stats-metric-tab.act{background:#2a3550;color:#fff;}
.stats-chart-svg{display:block;width:100%;height:110px;}
.stats-chart-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:10px;}
.lang-donut-row{display:flex;align-items:center;gap:14px;}
.lang-donut-svg{width:110px;height:110px;flex-shrink:0;}
.lang-legend{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
.lang-legend-row{display:flex;align-items:center;gap:6px;font-size:11px;}
.lang-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.lang-legend-lbl{color:#ccc;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lang-legend-val{color:#fff;font-weight:700;flex-shrink:0;margin-left:2px;}
.star-rating{display:flex;gap:2px;justify-content:center;}
.star-slot{position:relative;font-size:24px;line-height:1;color:rgba(255,255,255,.15);}
.star-rating.editable .star-slot{cursor:pointer;}
.star-fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#fbbf24;}
.ach-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px;cursor:pointer;transition:background .15s;}
.ach-card:hover{background:rgba(255,255,255,.09);}
.ach-info{flex:1;min-width:0;}
.ach-title{font-size:12px;font-weight:600;color:#fff;}
.ach-count{font-size:10px;color:#888;margin-top:1px;margin-bottom:6px;}
.ach-bar-wrap{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
.ach-bar-fill{height:100%;background:linear-gradient(90deg,#facc15,#22c55e);border-radius:4px;}
.ach-arrow{font-size:20px;color:#7eceff;flex-shrink:0;}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px 4px;}
.ach-badge{display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center;padding:4px 2px;border-radius:10px;transition:background .15s;}
.ach-badge:hover{background:rgba(255,255,255,.06);}
.ach-badge-lbl{font-size:9px;font-weight:600;color:#ccc;margin-top:4px;max-width:70px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;line-height:1.25;}
.ach-badge-tier{font-size:8px;color:#666;margin-top:1px;}
.tier-caption{text-align:center;font-size:11px;color:#7eceff;font-weight:600;margin-bottom:8px;}
.tier-bar{display:flex;gap:3px;margin-bottom:6px;}
.tier-seg{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
.tier-seg-fill{height:100%;background:#22c55e;border-radius:4px;}
.tier-marks{display:flex;gap:3px;}
.tier-mark{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tier-mark-icon{font-size:11px;}
.tier-mark-val{font-size:10px;color:#888;font-weight:600;}
.tier-mark.reached .tier-mark-val{color:#fff;}
.ach-back-btn{background:rgba(126,206,255,.1);border:1px solid rgba(126,206,255,.25);border-radius:20px;color:#7eceff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:7px 14px;margin-bottom:8px;}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:500;padding:1rem;}
.modal-box{position:relative;background:#1e2d4a;border:1px solid rgba(126,206,255,.18);border-radius:20px;padding:1.5rem;max-width:340px;width:100%;max-height:88vh;overflow-y:auto;}
.goal-num-input::-webkit-inner-spin-button,.goal-num-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.goal-num-input{-moz-appearance:textfield;}
.modal-box.wide{max-width:400px;}
.m-img{width:130px;height:130px;image-rendering:pixelated;display:block;margin:0 auto 10px;}
.m-emoji{font-size:46px;text-align:center;margin-bottom:10px;}
.m-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:6px;text-align:center;}
.m-desc{font-size:12px;color:#aaa;margin-bottom:1.25rem;text-align:center;line-height:1.6;}
.m-btns{display:flex;gap:8px;}
.m-btns button{flex:1;font-size:14px;padding:13px 10px;border-radius:12px;font-weight:600;cursor:pointer;min-height:44px;}
.btn-ok{background:#2563eb;color:#fff;border:none;}
.btn-ok:hover{background:#1d4ed8;}
.btn-cancel{background:rgba(255,255,255,.08);color:#ccc;border:1px solid rgba(255,255,255,.15);}
.btn-cancel:hover{background:rgba(255,255,255,.14);}
.flbl{font-size:10px;color:#7eceff;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;}
.finput{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:9px 12px;color:#fff;font-size:13px;outline:none;margin-bottom:10px;}
.finput:focus{border-color:#7eceff;}
select option{background:#1e2d4a;color:#fff;}
.ppill{background:rgba(126,206,255,.15);color:#7eceff;font-size:12px;font-weight:600;padding:8px;border-radius:10px;text-align:center;margin-bottom:10px;}
.shelf-wrap{width:100%;display:flex;flex-direction:column;gap:16px;background:#111009;border-radius:10px;padding:14px 0;}
.shelf-row{display:flex;flex-direction:column;}
.shelf-label{font-size:9px;color:#a08a5c;padding:0 10px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;}
.shelf-books{display:flex;align-items:flex-end;gap:5px;padding:16px 10px 0;height:192px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;}
.shelf-books.compact{height:165px;}
.shelf-books::-webkit-scrollbar{height:3px;}.shelf-books::-webkit-scrollbar-track{background:transparent;}.shelf-books::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.shelf-plank{width:100%;height:13px;background:linear-gradient(180deg,#7a5a32 0%,#5a3e1e 35%,#3e2a10 100%);box-shadow:0 6px 16px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.07);border-top:2px solid #9a7a4a;flex-shrink:0;margin-top:0;}
.book-wrap{position:relative;display:flex;flex-direction:row;flex-shrink:0;cursor:pointer;transition:transform .18s;}
.book-wrap:hover{transform:translateY(-14px);z-index:20;}
.book-spine{display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;}
.book-cover{position:relative;overflow:hidden;flex-shrink:0;}
.book-cover::before{content:'';position:absolute;top:0;left:0;bottom:0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,.08) 70%,transparent 100%);z-index:2;pointer-events:none;}
.book-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.book-cover-inner{position:absolute;inset:0;}
.book-pages-edge{position:absolute;top:3px;right:-5px;bottom:3px;width:5px;background:repeating-linear-gradient(180deg,#f2ede4 0px,#f2ede4 1.2px,#d5d0c6 1.2px,#d5d0c6 2px);border-radius:0 1px 1px 0;box-shadow:1px 0 4px rgba(0,0,0,.35);z-index:-1;}

/* EVO DOTS */
.evo-dots{display:flex;gap:2px;justify-content:center;margin-top:3px;}
.evo-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);}
.evo-dot.filled{background:#7eceff;}

/* SHOP ROW */
.shop-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.sh-emoji{font-size:20px;flex-shrink:0;}
.sh-info{flex:1;}
.sh-name{font-size:12px;font-weight:600;color:#fff;}
.sh-desc{font-size:10px;color:#888;margin-top:1px;}
.sh-price{font-size:11px;font-weight:600;color:#fbbf24;}
.sh-btn{font-size:11px;padding:5px 12px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;cursor:pointer;margin-top:4px;display:block;}
.sh-btn:disabled{opacity:.3;cursor:not-allowed;}
.sh-btn:not(:disabled):hover{background:rgba(255,255,255,.2);}

/* SIDE PANEL */
#side-panel{position:fixed;top:0;right:-380px;width:350px;max-width:88vw;height:100vh;height:100dvh;background:#1e2d4a;border-left:1px solid rgba(126,206,255,.15);z-index:400;transition:right .25s;padding:1rem;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
#side-panel.open{right:0;}
#side-ov{position:fixed;inset:0;z-index:399;display:none;background:rgba(0,0,0,.4);}
#side-ov.open{display:block;}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1e2d4a;border:1px solid rgba(126,206,255,.3);color:#7eceff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:700;white-space:nowrap;}
.toast.show{opacity:1;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
</style>
</head>
<body>
<div class="app">

<!-- SELECT -->
<div id="screen-select" class="screen active">
  <div class="sel-bg">
    <div class="sel-grid" id="sel-grid"></div>
  </div>
</div>

<!-- MAIN -->
<div id="screen-main" class="screen">
  <div class="hdr">
    <button class="back-btn" onclick="showSelect()">←</button>
    <div class="hdr-av" id="hdr-av" onclick="openProfileSettings()" style="cursor:pointer"></div>
    <div class="hdr-info">
      <div class="hdr-name" id="hdr-name"></div>
      <div class="hdr-loc" id="hdr-loc"></div>
    </div>
    <div class="hdr-res">
      <span id="save-status" style="font-size:11px;font-weight:700;visibility:hidden;display:inline-block;width:14px;text-align:center;flex-shrink:0"></span>
      <div class="rpill" id="hdr-coins" title="Монети — трать у Магазині">🪙0</div>
      <div class="rpill rpill-menu" onclick="openSidePanel()" title="Книжкові бали — трать на лов. Тапни, щоб додати книгу">➕📙<span id="hdr-bookpoints">0</span></div>
    </div>
  </div>

function chainsForLoc(locId){return CHAINS.filter(c=>c.loc===locId);}
function stagePrice(chain,idx){
  const st=chain.stages[idx];
  if(chain.stages.length===1) return 10;
  if(st.mega) return 20;
  return idx===0?5:idx===1?7:10;
}
function nextStageIdx(d,chain){const idx=d.progress[chain.id];return idx===undefined?0:idx+1;}
function catchableStages(locId){
  const d=pd();const out=[];
  chainsForLoc(locId).forEach(chain=>{
    const idx=nextStageIdx(d,chain);
    if(idx>=chain.stages.length)return;
    const weight=chain.stages[idx].mega?1:3;
    for(let i=0;i<weight;i++) out.push({chain,idx});
  });
  return out;
}
function locHasMega(d,locId){
  return chainsForLoc(locId).some(chain=>{
    const idx=d.progress[chain.id];
    return idx!==undefined && chain.stages[idx].mega;
  });
}
function caughtCountIn(d,locIds){
  let n=0;
  locIds.forEach(l=>chainsForLoc(l).forEach(c=>{if(d.progress[c.id]!==undefined)n++;}));
  return n;
}
function megasCaughtIn(d,locIds){
  let n=0;
  locIds.forEach(l=>chainsForLoc(l).forEach(c=>{const idx=d.progress[c.id];if(idx!==undefined&&c.stages[idx].mega)n++;}));
  return n;
}
function touchProgressOrder(d,chainId){
  if(!d.progressOrder)d.progressOrder=[];
  const i=d.progressOrder.indexOf(chainId);
  if(i>=0)d.progressOrder.splice(i,1);
  d.progressOrder.push(chainId);
}
function isLocComplete(locId){
  const d=pd();const chains=chainsForLoc(locId);
  if(!chains.length)return false;
  return chains.every(c=>d.progress[c.id]===c.stages.length-1);
}

function reqMet(d,req){
  if(!req)return true;
  if(req.type==='keyChain') return d.progress[req.chainId]!==undefined && d.progress[req.chainId]>=req.stageIdx;
  if(req.type==='locMega') return locHasMega(d,req.loc);
  if(req.type==='count') return caughtCountIn(d,req.locs)>=req.need;
  if(req.type==='megaCount') return megasCaughtIn(d,req.locs)>=req.need;
  return false;
}
function unlockHintText(loc){
  const req=loc.unlockReq;if(!req)return'';
  const d=pd();
  if(req.type==='keyChain'){
    const chain=CHAINS.find(c=>c.id===req.chainId);const stage=chain.stages[req.stageIdx];
    const cur=d.progress[req.chainId];
    const seq=chain.stages.map((s,i)=>{
      if(i===req.stageIdx)return`<b style="color:#fbbf24">${s.name}</b>`;
      if(cur!==undefined&&i<=cur)return`${s.name} ✓`;
      return s.name;
    }).join(' → ');
    const srcLoc=LOCS[chain.loc];
    return`Потрібен ключовий покемон: <b>${stage.name}</b>.<br><span style="font-size:11px;opacity:.85">${seq}</span><br>Злови його в «${srcLoc?srcLoc.name:''}» або докупи в 🛒 Магазині.`;
  }
  if(req.type==='locMega'){
    const locName=LOCS[req.loc]?.name||req.loc;
    return`Потрібна будь-яка Мега-еволюція 🐉 з локації <b>${locName}</b>.`;
  }
  if(req.type==='count'){
    const have=caughtCountIn(d,req.locs);
    return`Потрібно зловити ${req.need} видів покемонів<br>(зараз: ${have} / ${req.need}).`;
  }
  if(req.type==='megaCount'){
    const have=megasCaughtIn(d,req.locs);
    return`Потрібно ${req.need} Мега-еволюцій 🐉<br>(зараз: ${have} / ${req.need}).`;
  }
  return'';
}

let _goalTab='month';
function curMonthKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function curYearKey(){return String(new Date().getFullYear());}
function pluralUA(n,one,few,many){
  const n10=n%10,n100=n%100;
  if(n100>=11&&n100<=14)return many;
  if(n10===1)return one;
  if(n10>=2&&n10<=4)return few;
  return many;
}
function bookWord(n){return pluralUA(n,'книга','книги','книг');}
function bookPeriodKeys(book){
  let dt;
  if(book.ts){dt=new Date(book.ts);}
  else{
    const m=(book.date||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if(!m)return{month:null,year:null};
    dt=new Date(+m[3],+m[2]-1,+m[1]);
  }
  return{month:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'),year:String(dt.getFullYear())};
}
function booksInMonth(d,monthKey){return(d.books||[]).filter(b=>bookPeriodKeys(b).month===monthKey).length;}
function booksInYear(d,yearKey){return(d.books||[]).filter(b=>bookPeriodKeys(b).year===yearKey).length;}
function booksForPeriod(d,period){
  const books=d.books||[];
  if(period==='all')return books;
  const key=period==='month'?curMonthKey():curYearKey();
  return books.filter(b=>bookPeriodKeys(b)[period]===key);
}
function statsForPeriod(d,period){
  const filtered=booksForPeriod(d,period);
  return{books:filtered.length,pages:filtered.reduce((s,b)=>s+(b.pages||0),0)};
}
// Best-effort language guess from the book TITLE only (no full text available):

  'Фентезі':'#a78bfa','Пригоди':'#fb923c','Наукова фантастика':'#38bdf8','Детектив':'#818cf8',
  'Дитяча':'#facc15','Підліткова':'#f472b6','Гумор':'#a3e635','Історичне':'#fbbf24',
  'Жахи / Містика':'#f87171','Реалізм':'#2dd4bf','Нонфікшн':'#22d3ee','Комікс / Манга':'#e879f9',
  'Романтика':'#c084fc','Класика':'#60a5fa','Антиутопія':'#34d399','Трилер':'#4ade80',
};
const LANG_META={
  uk:{label:'Українська',color:'#60a5fa'},
  ru:{label:'Оркська',color:'#4d7c3a'},
  en:{label:'English',color:'#f87171'},
  ro:{label:'Румунська',color:'#c084fc'},
  pl:{label:'Польська',color:'#fb923c'},
  de:{label:'Німецька',color:'#facc15'},
  fr:{label:'Французька',color:'#22d3ee'},
  es:{label:'Іспанська',color:'#a3e635'},
};
function detectBookLanguage(title){
  title=title||'';
  if(/[Ѐ-ӿ]/.test(title)){
    if(/[іїєґІЇЄҐ]/.test(title))return'uk';
    if(/[ыэъЫЭЪ]/.test(title))return'ru';
    if(/(^|\s)[иИ](\s|$)/.test(title))return'ru'; // standalone "и" = Russian "and"
    if(/(^|\s)[йЙ](\s|$)/.test(title))return'uk'; // standalone "й" = Ukrainian "and"
    return'uk';
  }
  if(/[ăâîșțşţĂÂÎȘȚŞŢ]/.test(title))return'ro';
  if(/[ąćęłńśżźĄĆĘŁŃŚŻŹ]/.test(title))return'pl';
  if(/[äöüßÄÖÜ]/.test(title))return'de';
  if(/[àâçéèêëîïôùûÿœÀÂÇÉÈÊË]/.test(title))return'fr';
  if(/[áíñóúü¿¡ÁÍÑÓÚÜ]/.test(title))return'es';
  return'en';
}
function langBreakdown(books){
  const counts={};
  books.forEach(b=>{const l=detectBookLanguage(b.title);counts[l]=(counts[l]||0)+1;});
  return Object.entries(counts).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1])
    .map(([lang,count])=>({lang,count,...LANG_META[lang]}));
}
function monthlyBreakdown(d,yearKey){
  const arr=Array.from({length:12},()=>({books:0,pages:0,ratingSum:0,ratingCount:0}));
  (d.books||[]).forEach(b=>{
    const pk=bookPeriodKeys(b);
    if(pk.year!==yearKey||!pk.month)return;
    const idx=parseInt(pk.month.split('-')[1],10)-1;
    arr[idx].books++;arr[idx].pages+=b.pages||0;
    if(b.rating){arr[idx].ratingSum+=b.rating;arr[idx].ratingCount++;}
  });
  return arr.map(m=>({...m,rating:m.ratingCount?Math.round((m.ratingSum/m.ratingCount)*10)/10:0}));
}
function availableStatsYears(d){
  const set=new Set((d.books||[]).map(b=>bookPeriodKeys(b).year).filter(Boolean));
  set.add(curYearKey());
  return Array.from(set).sort((a,b)=>b-a);
}
function monthlyGoalReward(target,achieved){return achieved>=target?target:0;}
function yearlyGoalReward(target,achieved){
  const pct=achieved/target;
  if(pct>=1)return target;
  if(pct>=0.75)return Math.floor(target*0.70);
  if(pct>=0.50)return Math.floor(target*0.40);
  return 0;
}

// Evaluates any past-due goal (month/year rolled over since it was set) and queues the
// result popup + reward, then queues a "set a new goal" prompt if none is active yet
// for the current period and the player hasn't dismissed it already this period.
function checkGoalEvents(){
  const d=pd();
  const mKey=curMonthKey(),yKey=curYearKey();

  if(d.monthlyGoal&&!d.monthlyGoal.resolved&&d.monthlyGoal.periodKey!==mKey){
    const g=d.monthlyGoal;
    const achieved=booksInMonth(d,g.periodKey);
    const reward=monthlyGoalReward(g.target,achieved);
    d.coins=(d.coins||0)+reward;
    g.resolved=true;
    d.currentGoalStreak=achieved>=g.target?(d.currentGoalStreak||0)+1:0;
    d.bestGoalStreak=Math.max(d.bestGoalStreak||0,d.currentGoalStreak);
    if(reward>0){
      qM(()=>mHTML(`<div class="m-emoji">🎉</div><div class="m-title">Ціль на місяць виконано!</div><div class="m-desc">Ти поставив ціль <b>${g.target}</b> ${bookWord(g.target)} і прочитав <b>${achieved}</b> — отримуєш <b>+${reward}🪙</b>!</div><div class="m-btns"><button class="btn-ok" onclick="closeModal()">Ура!</button></div>`));
    } else {
      qM(()=>mEmoji('📖','Ціль на місяць не досягнута',`Прогрес: ${achieved}/${g.target} ${bookWord(g.target)}.\nСпробуй ще наступного разу!`,[{l:'Ок',ok:true,cb:closeModal}]));
    }
    renderRes();saveToCloud(cur);
  }

  if(d.yearlyGoal&&!d.yearlyGoal.resolved&&d.yearlyGoal.periodKey!==yKey){
    const g=d.yearlyGoal;
    const achieved=booksInYear(d,g.periodKey);
    const reward=yearlyGoalReward(g.target,achieved);
    d.coins=(d.coins||0)+reward;
    g.resolved=true;
    if(achieved>=g.target){
      qM(()=>mHTML(`<div class="m-emoji">🏆</div><div class="m-title">Річну ціль виконано!</div><div class="m-desc">Ти поставив ціль <b>${g.target}</b> ${bookWord(g.target)} на рік і прочитав <b>${achieved}</b> — отримуєш <b>+${reward}🪙</b>!</div><div class="m-btns"><button class="btn-ok" onclick="closeModal()">Ура!</button></div>`));
    } else if(reward>0){
      qM(()=>mHTML(`<div class="m-emoji">🥈</div><div class="m-title">Майже вийшло!</div><div class="m-desc">Ціль була <b>${g.target}</b> ${bookWord(g.target)} на рік, прочитано <b>${achieved}</b>. За результат — <b>+${reward}🪙</b>!</div><div class="m-btns"><button class="btn-ok" onclick="closeModal()">Дякую!</button></div>`));
    } else {
      qM(()=>mEmoji('📖','Річну ціль не досягнуто',`Прогрес: ${achieved}/${g.target} ${bookWord(g.target)}.\nСпробуй ще наступного разу!`,[{l:'Ок',ok:true,cb:closeModal}]));
    }
    renderRes();saveToCloud(cur);
  }

  // Only the monthly goal gets an auto-popup, and only up through the 20th —
  // setting a target for the last ~10 days of the month is pointless. The yearly
  // goal is never auto-prompted; it's set manually via the "Задати ціль" button
  // in the stats widget instead.
  if((!d.monthlyGoal||d.monthlyGoal.periodKey!==mKey)&&d.monthlyGoalDismissedFor!==mKey&&new Date().getDate()<=20){
    qM(()=>showSetGoalModal('month'));
  }
}

function showSetGoalModal(period){
  const isMonth=period==='month';
  const label=isMonth?'місяць':'рік';
  mHTML(`<button onclick="dismissGoalPrompt('${period}')" style="position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:18px;color:#7eceff;line-height:1;padding:4px">✕</button>
    <div class="m-emoji">🎯</div>
    <div class="m-title">Постав ціль на ${label}</div>
    <div class="m-desc">Скільки книг плануєш прочитати? Виконаєш — отримаєш відповідну нагороду.</div>
    <input type="number" id="goal-input" class="finput goal-num-input" min="1">
    <button class="btn-ok" style="width:100%;padding:13px;font-size:14px;min-height:44px" onclick="setGoal('${period}')">Встановити</button>`);
}
function dismissGoalPrompt(period){
  const d=pd();
  if(period==='month')d.monthlyGoalDismissedFor=curMonthKey();
  else d.yearlyGoalDismissedFor=curYearKey();
  closeModal();saveToCloud(cur);
}
function setGoal(period){
  const val=parseInt(document.getElementById('goal-input').value);
  if(!val||val<1){showToast('Введи число більше 0');return;}
  const d=pd();
  if(period==='month'){d.monthlyGoal={target:val,periodKey:curMonthKey(),resolved:false};delete d.monthlyGoalDismissedFor;}
  else{d.yearlyGoal={target:val,periodKey:curYearKey(),resolved:false};delete d.yearlyGoalDismissedFor;}
  closeModal();renderActions();saveToCloud(cur);
  showToast('Ціль встановлено!');
}

function renderGoalWidget(){
  const el=document.getElementById('goal-widget');if(!el)return;
  const d=pd();
  const isMonth=_goalTab==='month';
  const key=isMonth?curMonthKey():curYearKey();
  const goal=isMonth?d.monthlyGoal:d.yearlyGoal;
  const active=!!(goal&&goal.periodKey===key);
  const target=active?goal.target:0;
  const achieved=active?(isMonth?booksInMonth(d,key):booksInYear(d,key)):0;
  const pct=active?Math.min(100,Math.round((achieved/target)*100)):0;
  const centerLabel=active?`${achieved}/${target}`:'0';
  const btnLabel=active?'Переглянути всі':'Задати ціль';
  const btnOnclick=active?'openGoalHistory()':`showSetGoalModal('${isMonth?'month':'year'}')`;

  const r=68,cx=100,cy=76,sw=13;
  const arcLen=Math.PI*r;
  const dashOffset=arcLen*(1-pct/100);
  const arcD=`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;

  const tabs=`<div class="goal-tabs">
    <button class="goal-tab ${isMonth?'act':''}" onclick="setGoalTab('month')">На місяць</button>
    <button class="goal-tab ${!isMonth?'act':''}" onclick="setGoalTab('year')">На рік</button>
  </div>`;

  const gauge=`<div class="goal-gauge-wrap">
    <svg viewBox="0 0 200 96" class="goal-gauge-svg">
      <defs><linearGradient id="goalGaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#facc15"/><stop offset="100%" stop-color="#22c55e"/>
      </linearGradient></defs>
      <path d="${arcD}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${sw}" stroke-linecap="round"/>
      <path d="${arcD}" fill="none" stroke="url(#goalGaugeGrad)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${arcLen}" stroke-dashoffset="${dashOffset}"/>
    </svg>
    <div class="goal-gauge-center">
      <div class="goal-gauge-label">КНИГИ</div>
      <div class="goal-gauge-value">${centerLabel}</div>
    </div>
  </div>
  <button class="goal-action-btn" onclick="${btnOnclick}">${btnLabel}</button>`;

  el.innerHTML=`<div class="goal-widget-inner">${tabs}${gauge}</div>`;
}

let _statsPeriod='month',_chartYear=null,_chartMetric='books';

function renderLangDonutHTML(books){
  const breakdown=langBreakdown(books);
  const total=books.length;
  if(!total){
    return`<div class="stats-chart-card">
      <div class="stats-chart-title">Топ за мовами</div>
      <div style="text-align:center;color:#666;font-size:12px;padding:20px 0">Немає книг за цей період</div>
    </div>`;
  }
  const r=45,cx=60,cy=60,sw=22,circ=2*Math.PI*r,gapLen=breakdown.length>1?4:0;
  let acc=0;
  const arcs=breakdown.map(({count,color})=>{
    const len=circ*(count/total);
    const visLen=Math.max(0,len-gapLen);
    const offset=-acc;
    acc+=len;
    return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${visLen} ${circ-visLen}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  const legend=breakdown.map(({label,color,count})=>
    `<div class="lang-legend-row"><span class="lang-dot" style="background:${color}"></span><span class="lang-legend-lbl">${label}</span><span class="lang-legend-val">${count}</span></div>`
  ).join('');
  return`<div class="stats-chart-card">
    <div class="stats-chart-title">Топ за мовами</div>
    <div class="lang-donut-row">
      <svg viewBox="0 0 120 120" class="lang-donut-svg">${arcs}
        <text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="#fff">${total}</text>
      </svg>
      <div class="lang-legend">${legend}</div>
    </div>
  </div>`;
}
function genreBreakdown(books){
  const counts={};
  books.forEach(b=>{if(b.genre)counts[b.genre]=(counts[b.genre]||0)+1;});
  return Object.entries(counts).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1])
    .map(([genre,count])=>({genre,label:genre,count,color:GENRE_COLORS[genre]||'#94a3b8'}));
}
function renderGenreDonutHTML(books){

    </div>`;
  }
  const r=45,cx=60,cy=60,sw=22,circ=2*Math.PI*r,gapLen=breakdown.length>1?4:0;
  let acc=0;
  const arcs=breakdown.map(({count,color})=>{
    const len=circ*(count/total);
    const visLen=Math.max(0,len-gapLen);
    const offset=-acc;
    acc+=len;
    return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${visLen} ${circ-visLen}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  const legend=breakdown.map(({label,color,count})=>
    `<div class="lang-legend-row"><span class="lang-dot" style="background:${color}"></span><span class="lang-legend-lbl">${label}</span><span class="lang-legend-val">${count}</span></div>`
  ).join('');
  return`<div class="stats-chart-card">
    <div class="stats-chart-title">Топ за жанрами</div>
    <div class="lang-donut-row">
      <svg viewBox="0 0 120 120" class="lang-donut-svg">${arcs}
        <text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="#fff">${total}</text>
      </svg>
      <div class="lang-legend">${legend}</div>
    </div>
  </div>`;
}
const LOC_COLORS={oak:'#4ade80',pallet:'#38bdf8',forest:'#facc15',glade:'#a78bfa',butterfly:'#f472b6',caves:'#94a3b8',shore:'#fb923c'};
function renderLocationProgressHTML(d){
  const locs=ALL_KANTO_LOCS.filter(locId=>chainsForLoc(locId).length>0);
  const r=45,cx=60,cy=60,sw=22,circ=2*Math.PI*r;
  const segLen=circ/locs.length,gapLen=4;
  let caughtAll=0,totalAll=0;
  const arcs=locs.map((locId,i)=>{
    const total=chainsForLoc(locId).length;
    const unlocked=(d.unlockedLocs||[]).includes(locId);
    const caught=unlocked?caughtCountIn(d,[locId]):0;
    totalAll+=total;caughtAll+=caught;
    const frac=unlocked&&total?caught/total:0;
    const fillLen=Math.max(0,segLen*frac-gapLen);
    const offset=-(i*segLen);
    return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${LOC_COLORS[locId]}" stroke-width="${sw}"
      stroke-dasharray="${fillLen} ${circ-fillLen}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  const legend=locs.map(locId=>{
    const loc=LOCS[locId];
    const total=chainsForLoc(locId).length;
    const unlocked=(d.unlockedLocs||[]).includes(locId);
    const caught=unlocked?caughtCountIn(d,[locId]):0;
    return`<div class="lang-legend-row">
      <span class="lang-dot" style="background:${unlocked?LOC_COLORS[locId]:'#444'}"></span>
      <span class="lang-legend-lbl">${loc.name}${unlocked?'':' 🔒'}</span>
      <span class="lang-legend-val">${unlocked?caught+'/'+total:'—'}</span>
    </div>`;
  }).join('');
  return`<div class="stats-chart-card">
    <div class="stats-chart-title">Прогрес по локаціях</div>
    <div class="lang-donut-row">
      <svg viewBox="0 0 120 120" class="lang-donut-svg">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="${sw}"/>
        ${arcs}
        <text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="800" fill="#fff">${caughtAll}/${totalAll}</text>
      </svg>
      <div class="lang-legend">${legend}</div>
    </div>
  </div>`;
}
function renderGeneralStatsWidget(){
  const el=document.getElementById('general-stats-widget');if(!el)return;
  const d=pd();
  if(!_chartYear)_chartYear=curYearKey();
  const periodLabels={month:'Місяць',year:'Рік',all:'Весь час'};
  const stat=statsForPeriod(d,_statsPeriod);
  const periodTabs=`<div class="goal-tabs">${['month','year','all'].map(p=>
    `<button class="goal-tab ${p===_statsPeriod?'act':''}" onclick="setStatsPeriod('${p}')">${periodLabels[p]}</button>`).join('')}</div>`;
  const tiles=`<div class="stat-tiles">
    <div class="stat-tile"><div class="stat-tile-val">${stat.books}</div><div class="stat-tile-lbl">${bookWord(stat.books)}</div></div>
    <div class="stat-tile"><div class="stat-tile-val">${stat.pages}</div><div class="stat-tile-lbl">сторінок</div></div>
  </div>`;

  const years=availableStatsYears(d);
  const breakdown=monthlyBreakdown(d,_chartYear);
  const maxVal=_chartMetric==='rating'?5:Math.max(1,...breakdown.map(m=>m[_chartMetric]));
  const monthLbls=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
  const barW=18,gap=6,chartH=80;
  const bars=breakdown.map((m,i)=>{
    const v=m[_chartMetric];
    const h=v>0?Math.max(3,Math.round((v/maxVal)*chartH)):0;
    const x=i*(barW+gap);
    return`<g style="cursor:pointer" onclick="showChartTip(event,${v})">
      <rect x="${x}" y="0" width="${barW}" height="${chartH}" fill="transparent"/>
      <rect class="bar-fill" x="${x}" y="${chartH-h}" width="${barW}" height="${h}" rx="4" fill="url(#statBarGrad)"/>
      <text x="${x+barW/2}" y="${chartH+11}" font-size="7" fill="#888" text-anchor="middle">${monthLbls[i]}</text>
    </g>`;
  }).join('');
  const chartWidth=12*(barW+gap)-gap;

  const chart=`<div class="stats-chart-card">
    <div class="stats-chart-hdr">
      <select class="stats-year-sel" onchange="setChartYear(this.value)">
        ${years.map(y=>`<option value="${y}" ${y===_chartYear?'selected':''}>${y}</option>`).join('')}
      </select>
      <div class="stats-metric-tabs">
        <button class="stats-metric-tab ${_chartMetric==='books'?'act':''}" onclick="setChartMetric('books')">Книги</button>
        <button class="stats-metric-tab ${_chartMetric==='pages'?'act':''}" onclick="setChartMetric('pages')">Сторінок</button>
        <button class="stats-metric-tab ${_chartMetric==='rating'?'act':''}" onclick="setChartMetric('rating')">Рейтинг</button>
      </div>
    </div>
    <div class="stats-chart-tooltip" style="display:none"></div>
    <svg viewBox="0 0 ${chartWidth} ${chartH+18}" class="stats-chart-svg">
      <defs><linearGradient id="statBarGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7eceff"/><stop offset="100%" stop-color="#3d7ab8"/>
      </linearGradient></defs>
      ${bars}
    </svg>
  </div>`;

  const langDonut=renderLangDonutHTML(booksForPeriod(d,_statsPeriod));
  const genreDonut=renderGenreDonutHTML(booksForPeriod(d,_statsPeriod));
  const locProgress=renderLocationProgressHTML(d);

  el.innerHTML=`${periodTabs}${tiles}${chart}${langDonut}${genreDonut}${locProgress}`;
}
function showChartTip(evt,value){
  const g=evt.currentTarget;
  const fill=g.querySelector('.bar-fill');
  const card=g.closest('.stats-chart-card');
  const tip=card.querySelector('.stats-chart-tooltip');
  const fr=fill.getBoundingClientRect(),cr=card.getBoundingClientRect();
  tip.textContent=value;
  tip.style.left=(fr.left+fr.width/2-cr.left)+'px';
  tip.style.top=(fr.top-cr.top)+'px';
  tip.style.display='block';
  clearTimeout(window._chartTipTimer);
  window._chartTipTimer=setTimeout(()=>{tip.style.display='none';},1500);
}

// ═══════════ ACHIEVEMENTS ═══════════
function timesWord(n){return pluralUA(n,'раз','рази','разів');}
function purchaseWord(n){return pluralUA(n,'покупка','покупки','покупок');}
function pokeWord(n){return pluralUA(n,'покемона','покемони','покемонів');}
function locWord(n){return pluralUA(n,'локація','локації','локацій');}
function maxByAuthor(d){
  const counts={};
  (d.books||[]).forEach(b=>{
    const a=(b.author||'').trim().toLowerCase();
    if(!a)return;
    counts[a]=(counts[a]||0)+1;
  });
  const vals=Object.values(counts);
  return vals.length?Math.max(...vals):0;
}
function maxByGenre(d){
  const counts={};
  (d.books||[]).forEach(b=>{if(b.genre)counts[b.genre]=(counts[b.genre]||0)+1;});
  const vals=Object.values(counts);
  return vals.length?Math.max(...vals):0;

function achievementTierInfo(a,d){
  const val=a.valueFn(d);
  let unlockedCount=0;
  for(const t of a.tiers){if(val>=t)unlockedCount++;else break;}
  const nextTier=a.tiers[unlockedCount];
  const pct=nextTier?Math.min(100,Math.round((val/nextTier)*100)):100;
  return{val,unlockedCount,totalTiers:a.tiers.length,nextTier,pct};
}
function achievementsTotals(d){
  let unlocked=0,total=0;
  ACHIEVEMENTS.forEach(a=>{const info=achievementTierInfo(a,d);unlocked+=info.unlockedCount;total+=info.totalTiers;});
  return{unlocked,total};
}

    <div class="ach-arrow">›</div>
  </div>`;
}
function _lerpColor(hex1,hex2,t){
  const c1=parseInt(hex1.slice(1),16),c2=parseInt(hex2.slice(1),16);
  const r1=(c1>>16)&255,g1=(c1>>8)&255,b1=c1&255;
  const r2=(c2>>16)&255,g2=(c2>>8)&255,b2=c2&255;
  const r=Math.round(r1+(r2-r1)*t),g=Math.round(g1+(g2-g1)*t),b=Math.round(b1+(b2-b1)*t);
  return`#${((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}`;
}
function achBadgeHTML(a,d){
  const info=achievementTierInfo(a,d);
  const maxed=info.unlockedCount>=info.totalTiers;
  const locked=info.unlockedCount===0;
  const pct=maxed?100:info.pct;
  const r=27,circ=2*Math.PI*r;
  const dash=circ*(pct/100);
  const stroke=maxed?'#22c55e':_lerpColor('#facc15','#22c55e',pct/100);
  const sprite=!locked&&a.iconFn?a.iconFn(d):null;
  const iconSvg=sprite
    ?`<image href="${sprite}" x="12" y="12" width="46" height="46" style="image-rendering:pixelated"/>`
    :`<text x="35" y="36" font-size="24" text-anchor="middle" dominant-baseline="central">${locked?'🔒':a.emoji}</text>`;
  return`<div class="ach-badge" onclick="openAchievementDetail('${a.key}')">
    <svg viewBox="0 0 70 70" width="64" height="64">
      <circle cx="35" cy="35" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>
      <circle cx="35" cy="35" r="${r}" fill="none" stroke="${stroke}" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${circ}" stroke-dashoffset="${circ-dash}" transform="rotate(-90 35 35)"/>
      ${iconSvg}
    </svg>
    <div class="ach-badge-lbl">${a.title}</div>
    <div class="ach-badge-tier">${info.unlockedCount}/${info.totalTiers}</div>
  </div>`;
}

function achievementDetailHTML(a,d){
  const info=achievementTierInfo(a,d);

  const sprite=!locked&&a.iconFn?a.iconFn(d):null;
  const iconHtml=sprite
    ?`<img src="${sprite}" style="width:64px;height:64px;image-rendering:pixelated;display:block;margin:8px auto" onerror="this.style.display='none'">`

  const captionText=info.nextTier?`${Math.min(info.val,info.nextTier)}/${info.nextTier} до наступного рівня`:'Усі рівні відкрито!';
  return`<button onclick="openAchievementsModal()" class="ach-back-btn">← Усі нагороди</button>

function renderDex(){
  const d=pd();
  const held=CHAINS.filter(c=>d.progress[c.id]!==undefined);
  document.getElementById('dex-count').innerHTML=`🐣 ${held.length} &nbsp; 🐉 ${megasCaughtIn(d,ALL_KANTO_LOCS)}`;
  const grid=document.getElementById('dex-grid');
  const completeEl=document.getElementById('dex-complete');
  if(!held.length){grid.innerHTML='<div class="dex-empty">Ще нікого не спіймано.<br>Прочитай книгу і почни ловити!</div>';completeEl.innerHTML='';return;}
  const inProgress=held.filter(c=>d.progress[c.id]<c.stages.length-1);
  const done=held.filter(c=>d.progress[c.id]===c.stages.length-1);
  const order=d.progressOrder||[];
  const byRecency=(a,b)=>{
    const ai=order.indexOf(a.id),bi=order.indexOf(b.id);
    if(ai===-1&&bi===-1)return 0;
    if(ai===-1)return 1;
    if(bi===-1)return -1;
    return bi-ai;
  };
  inProgress.sort(byRecency);
  done.sort(byRecency);
  grid.innerHTML=inProgress.map(chain=>{
    const idx=d.progress[chain.id];const stage=chain.stages[idx];
    const dots=chain.stages.length>1?`<div class="evo-dots">${chain.stages.map((s,i)=>`<div class="evo-dot ${i<=idx?'filled':''}"></div>`).join('')}</div>`:'';
    return`<div class="dex-card" onclick="openDexCard('${chain.id}')">
      <img class="dex-img" src="${img(stage.pid)}" onerror="this.outerHTML='<div style=font-size:24px;text-align:center;height:68px;line-height:68px>${stage.name[0]}</div>'">
      <div class="dex-name">${stage.name}</div>
      ${dots}
    </div>`;
  }).join('')||'<div class="dex-empty">Усі спіймані ланцюжки завершено!</div>';
  if(!done.length){completeEl.innerHTML='';return;}
  const chainHtml=done.map(chain=>{
    const sprites=chain.stages.map((s,i)=>(i>0?`<div class="chain-arrow">→</div>`:'')+
      `<div class="chain-sprite" onclick="event.stopPropagation();openDexCard('${chain.id}')">
        <img style="width:38px;height:38px;object-fit:contain;image-rendering:pixelated" src="${img(s.pid)}" onerror="this.style.display='none'">
        <div style="font-size:6.5px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44px;margin-top:1px;line-height:1.2">${s.name}</div>
      </div>`).join('');
    return`<div class="chain-block"><div class="chain-block-badge">✓</div>${sprites}</div>`;
  }).join('');
  completeEl.innerHTML=`<div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#fbbf24;margin:4px 0 5px;opacity:.8">🏆 Завершені</div><div class="chain-row">${chainHtml}</div>`;
}

  if(idx===chain.stages.length-1&&chain.stages.length>1){
    const gallery=chain.stages.map(s=>`<div style="text-align:center">

function checkUnlocks(){
  const d=pd();const opened=[];
  Object.values(LOCS).forEach(loc=>{
    if(d.unlockedLocs.includes(loc.id)||!loc.unlockReq)return;
    if(reqMet(d,loc.unlockReq)){d.unlockedLocs.push(loc.id);opened.push(loc);}
  });
  return opened;
}

        +`</g>`;
    });

    let mh='';
    Object.entries(byLoc).forEach(([lid,list])=>{
      const loc=LOCS_JOHTO[lid];if(!loc)return;
      const nr=22;const offs=list.map((_,i)=>(i-(list.length-1)/2)*16);
      list.forEach((p,i)=>{mh+=`<circle cx="${loc.cx+offs[i]}" cy="${loc.cy-nr-9}" r="5" fill="${pClr(p,state.players[p.id])}" stroke="#fff" stroke-width="1.5"/>`;});
    });
    document.getElementById('map-markers').innerHTML=mh;
    return;
  }
  document.getElementById('map-png').style.display='';
  document.getElementById('map-bg').style.display='none';
  document.getElementById('map-edges').innerHTML='';
  const r=26;let nh='';
  Object.values(LOCS).forEach(loc=>{
    const ul=d.unlockedLocs.includes(loc.id);
    const isHere=d.location===loc.id;
    if(isHere){
      nh+=`<circle cx="${loc.cx}" cy="${loc.cy}" r="${r+10}" fill="${loc.color}" opacity=".18"/>`;
      nh+=`<circle cx="${loc.cx}" cy="${loc.cy}" r="${r+5}" fill="none" stroke="${loc.stroke}" stroke-width="1.5" opacity=".55"/>`;
      nh+=`<circle cx="${loc.cx}" cy="${loc.cy}" r="${r}" fill="none" stroke="${loc.stroke}" stroke-width="2.5" opacity=".9"/>`;
    }
    if(!ul){
      nh+=`<g style="cursor:pointer" onclick="showLockedHint('${loc.id}')">`;
      nh+=`<circle cx="${loc.cx}" cy="${loc.cy}" r="${r}" fill="rgba(3,8,20,0.68)"/>`;
      nh+=`<text x="${loc.cx}" y="${loc.cy+1.5}" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="sans-serif">🔒</text>`;
      nh+=`</g>`;
    } else if(!isHere){
      nh+=`<circle cx="${loc.cx}" cy="${loc.cy}" r="${r}" fill="transparent" stroke="rgba(255,255,255,.08)" stroke-width="1" style="cursor:pointer" onclick="onLocClick('${loc.id}')"/>`;
    }
    if(ul&&isLocComplete(loc.id)){
      nh+=`<circle cx="${loc.cx+r-2}" cy="${loc.cy-r+2}" r="7" fill="#fbbf24" stroke="#070e1a" stroke-width="1.5"/>`;
      nh+=`<text x="${loc.cx+r-2}" y="${loc.cy-r+3}" text-anchor="middle" dominant-baseline="middle" font-size="8.5" font-weight="700" font-family="sans-serif" fill="#070e1a">✓</text>`;
    }
  });
  nh+=`<g style="cursor:pointer" onclick="openShop()">`
    +`<circle cx="${SHOP_NODE.cx}" cy="${SHOP_NODE.cy}" r="22" fill="${SHOP_NODE.color}" stroke="${SHOP_NODE.stroke}" stroke-width="2"/>`
    +`<text x="${SHOP_NODE.cx}" y="${SHOP_NODE.cy+1}" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="sans-serif">🛒</text>`
    +`<text x="${SHOP_NODE.cx}" y="${SHOP_NODE.cy+22+11}" text-anchor="middle" font-size="8.5" fill="#e2e8f0" font-family="sans-serif" font-weight="600">Магазин</text>`
    +`</g>`;
  document.getElementById('map-nodes').innerHTML=nh;
  const byLoc={};
  PLAYERS.forEach(p=>{if((state.players[p.id].region||'kanto')==='kanto'){const lid=state.players[p.id].location;if(!byLoc[lid])byLoc[lid]=[];byLoc[lid].push(p);}});
  let mh='';
  Object.entries(byLoc).forEach(([lid,list])=>{
    const loc=LOCS[lid];if(!loc)return;
    const offs=list.map((_,i)=>(i-(list.length-1)/2)*16);
    list.forEach((p,i)=>{mh+=`<circle cx="${loc.cx+offs[i]}" cy="${loc.cy-r-7}" r="6" fill="${pClr(p,state.players[p.id])}" stroke="#fff" stroke-width="2"/>`;});

function renderActions(){
  const d=pd();
  const loc=cLoc();
  document.getElementById('act-emoji').innerHTML=locIconEl(loc.id,48);
  document.getElementById('act-name').textContent=loc.name;
  const chains=chainsForLoc(loc.id);
  let desc='';
  if(chains.length){
    const totalSpecies=chains.reduce((s,c)=>s+c.stages.length,0);
    const caughtSpecies=chains.reduce((s,c)=>{const idx=d.progress[c.id];return s+(idx!==undefined?idx+1:0);},0);
    const allDone=chains.every(c=>d.progress[c.id]===c.stages.length-1);
    desc='Спіймано: '+caughtSpecies+'/'+totalSpecies+(allDone?' ✓':'');
  }
  document.getElementById('act-desc').textContent=desc;
  const ab=document.getElementById('act-badge');
  ab.textContent=loc.badge||'';ab.style.background=loc.badgeBg||'';ab.style.color=loc.badgeTxt||'';
  let html;
  if(loc.id==='map2'){
    html=`<div class="act-row" onclick="enterJohto()"><div class="act-icon">🌏</div><div class="act-body"><div class="act-title">Перейти до Регіону Джото</div><div class="act-desc">Новий регіон відкрито — покемони чекають попереду!</div></div></div>`;
  } else if(loc.id==='newbark'){
    html=`<div class="act-row" onclick="returnToKanto()"><div class="act-icon">🗺️</div><div class="act-body"><div class="act-title">Повернутись до Регіону Канто</div></div></div>`;
  } else {
    const pool=catchableStages(loc.id);
    if(!pool.length){
      html=`<button class="catch-btn done">✓ Усі покемони тут спіймані!</button>`;
    } else {
      html=`<button class="catch-btn" onclick="doCatch()">Ловити покемона <span class="catch-cost">1📙</span></button>`;
    }
  }
  document.getElementById('act-list').innerHTML=html;
  renderGoalWidget();
}

function doCatch(){
  const d=pd();
  if(d.bookPoints<1){
    qM(()=>mEmoji('📙','Мало книжкових балів','Прочитай книгу, щоб отримати 📙 і зловити покемона!',
      [{l:'Додати книгу',ok:true,cb:()=>{closeModal();openSidePanel();}},{l:'Ок',cb:closeModal}]));
    return;
  }
  const pool=catchableStages(d.location);
  if(!pool.length){showToast('Тут усі покемони вже спіймані!');return;}
  d.bookPoints--;
  const pick=pool[ri(0,pool.length-1)];
  d.progress[pick.chain.id]=pick.idx;
  touchProgressOrder(d,pick.chain.id);
  const stage=pick.chain.stages[pick.idx];
  renderRes();renderDex();renderActions();renderMap();
  const opened=checkUnlocks();
  if(opened.length)renderMap();
  saveToCloud(cur);
  qM(()=>mImg(img(stage.pid),'Спіймано '+stage.name+'!','Тепер у твоїй колекції.',[{l:'Чудово!',ok:true,cb:closeModal}]));
  opened.forEach(u=>qM(()=>mEmoji('🎉','Відкрито!',`${u.emoji} ${u.name} тепер доступна!`,[{l:'Чудово!',ok:true,cb:closeModal}])));
}

function chainKeyLoc(chainId){
  const d=pd();
  return Object.values(LOCS).find(loc=>!d.unlockedLocs.includes(loc.id)&&loc.unlockReq&&loc.unlockReq.type==='keyChain'&&loc.unlockReq.chainId===chainId);
}

function _buildShopHTML(){
  const d=pd();
  const rows=[];
  d.unlockedLocs.forEach(locId=>{
    chainsForLoc(locId).forEach(chain=>{
      const idx=nextStageIdx(d,chain);
      if(idx>=chain.stages.length)return;
      rows.push({chain,idx,stage:chain.stages[idx],price:stagePrice(chain,idx)});
    });
  });
  rows.sort((a,b)=>{
    const ak=chainKeyLoc(a.chain.id)&&a.idx===chainKeyLoc(a.chain.id).unlockReq.stageIdx?1:0;
    const bk=chainKeyLoc(b.chain.id)&&b.idx===chainKeyLoc(b.chain.id).unlockReq.stageIdx?1:0;
    return bk-ak;
  });
  const html=rows.map(r=>{
    const keyLoc=chainKeyLoc(r.chain.id);
    let keyNote='';
    if(keyLoc){
      keyNote=r.idx===keyLoc.unlockReq.stageIdx
        ?`<div style="margin-top:3px;font-size:9px;font-weight:700;color:#4ade80">🔑 Відкриє «${keyLoc.name}»!</div>`
        :`<div style="margin-top:3px;font-size:9px;color:#fbbf24">→ веде до ключа «${keyLoc.name}»</div>`;
    }
    return`<div class="shop-row" ${keyLoc&&r.idx===keyLoc.unlockReq.stageIdx?'style="background:rgba(74,222,128,.06);border-radius:8px;padding:8px 6px;margin:0 -6px"':''}>
      <img class="sh-emoji" src="${img(r.stage.pid)}" style="width:40px;height:40px;image-rendering:pixelated" onerror="this.style.display='none'">
      <div class="sh-info"><div class="sh-name">${r.stage.name}</div><div class="sh-desc">${r.chain.stages.length>1?'Стадія '+(r.idx+1)+'/'+r.chain.stages.length:'Локація: '+(LOCS[r.chain.loc]?.name||'')}</div>${keyNote}</div>
      <div style="text-align:right;flex-shrink:0"><div class="sh-price">🪙${r.price}</div>
      <button class="sh-btn" onclick="buyChainStage('${r.chain.id}',${r.idx})" ${d.coins<r.price?'disabled':''}>Купити</button></div>
    </div>`;
  }).join('');
  return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="m-title" style="margin:0">🛒 Магазин</div>
    <div style="font-size:14px;font-weight:700;color:#fbbf24">🪙${d.coins}</div>
  </div><div style="max-height:340px;overflow-y:auto;padding-right:10px;margin-right:-10px">${html||'<div style="font-size:12px;color:#555;text-align:center;padding:1rem">Немає нічого на продаж — спочатку відкрий локації!</div>'}</div>
  <button class="btn-cancel" style="width:100%;margin-top:12px;padding:13px;font-size:14px;min-height:44px" onclick="closeModal()">Закрити</button>`;
}
function openShop(){
  const box=document.querySelector('#mOv .modal-box');
  if(box){box.innerHTML=_buildShopHTML();return;}
  mHTML(_buildShopHTML(),true);
}

let _shopFlowQueue=[];
function buyChainStage(chainId,idx){
  const d=pd();const chain=CHAINS.find(c=>c.id===chainId);if(!chain)return;
  const price=stagePrice(chain,idx);
  if(d.coins<price)return;
  d.coins-=price;d.progress[chainId]=idx;
  d.totalBought=(d.totalBought||0)+1;
  d.totalCoinsSpent=(d.totalCoinsSpent||0)+price;
  touchProgressOrder(d,chainId);
  renderRes();renderDex();renderActions();renderMap();
  const opened=checkUnlocks();
  if(opened.length)renderMap();
  saveToCloud(cur);
  // Stay inside the same modal box throughout — swap content in place (bought ->
  // any unlock notices -> back to the shop) instead of closing it, so the player
  // lands back in the shop afterward rather than getting bounced out entirely.
  _shopFlowQueue=[
    {type:'bought',pid:chain.stages[idx].pid,name:chain.stages[idx].name},
    ...opened.map(u=>({type:'unlocked',emoji:u.emoji,name:u.name})),
  ];
  _shopFlowNext();
}
function _shopFlowNext(){
  const box=document.querySelector('#mOv .modal-box');if(!box)return;
  if(_shopFlowQueue.length){
    const item=_shopFlowQueue.shift();
    if(item.type==='bought'){
      box.innerHTML=`<img class="m-img" src="${img(item.pid)}" onerror="this.style.display='none'"><div class="m-title">Куплено!</div><div class="m-desc" style="text-align:center">${item.name} тепер у твоїй колекції.</div><div class="m-btns"><button class="btn-ok" onclick="_shopFlowNext()">Чудово!</button></div>`;
    } else {
      box.innerHTML=`<div class="m-emoji">🎉</div><div class="m-title">Відкрито!</div><div class="m-desc" style="text-align:center">${item.emoji} ${item.name} тепер доступна!</div><div class="m-btns"><button class="btn-ok" onclick="_shopFlowNext()">Чудово!</button></div>`;
    }
  } else {
    openShop();
  }
}

// ═══════════ STAR RATING (shared, supports half-stars) ═══════════
function starRatingHTML(rating,editable,onClickFnName){
  rating=rating||0;
  let stars='';
  for(let i=1;i<=5;i++){
    const fillPct=Math.max(0,Math.min(100,(rating-(i-1))*100));
    stars+=`<span class="star-slot" ${editable?`onclick="${onClickFnName}(event,${i})"`:''}>
      <span class="star-bg">★</span><span class="star-fg" style="width:${fillPct}%">★</span>
    </span>`;
  }
  return`<div class="star-rating ${editable?'editable':''}">${stars}</div>`;
}
function _starClickIsHalf(event){
  const rect=event.currentTarget.getBoundingClientRect();
  return(event.clientX-rect.left)<rect.width/2;
}

  ['#3a4a5c','#1f2830','#2d3a45'],['#6b3f1f','#3a220f','#4f2f17'],
  ['#6b1f3a','#380f1f','#4f172d'],['#1f5c6b','#0f323a','#17454f'],
  ['#8a5c1f','#483010','#6b4717'],
];
function _colorFor(title){let h=0;for(const c of title)h=(h*31+c.charCodeAt(0))%_BPALETTE.length;return _BPALETTE[Math.abs(h)];}
function _bookH(p){if(p<100)return 178;if(p<250)return 190;if(p<400)return 202;if(p<600)return 214;if(p<800)return 224;if(p<1000)return 234;return 244;}
function _coverW(p){if(p<100)return 90;if(p<250)return 100;if(p<400)return 108;if(p<600)return 114;if(p<800)return 119;if(p<1000)return 123;return 127;}
function _spineW(p){const[A,B,C,D]=[40,1500,6,65];const r=(Math.log(Math.max(p,A))-Math.log(A))/(Math.log(B)-Math.log(A));return Math.round(C+r*(D-C));}
function _titleSz(text,cw){const b=cw<100?10:cw<115?11:12;if(text.length>30)return b-1;if(text.length>18)return b;return b+1;}

function _renderBookPreviewHTML(book){
  const p=book.pages||1;
  const h=_bookH(p),sw=_spineW(p);
  const coverUrl=book.coverUrl||null;
  const cw=coverUrl?Math.round(h*2/3):_coverW(p);
  const [top,bot,spine]=_colorFor(book.title);
  const scale=0.58;
  const vh=Math.round(h*scale),vw=Math.round((sw+cw+6)*scale);
  const spineGrad=`linear-gradient(90deg,${bot} 0%,${spine} 40%,${top} 100%)`;
  const coverGrad=`linear-gradient(150deg,${top} 0%,${bot} 100%)`;
  const tsz=_titleSz(book.title,cw);
  const inner=`<div style="display:flex;flex-direction:row;height:${h}px;flex-shrink:0">
    <div style="width:${sw}px;height:${h}px;background:${spineGrad};display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 2px 0 5px rgba(255,255,255,.06),inset -3px 0 8px rgba(0,0,0,.45)">
      ${sw>=12?`<span style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:${Math.max(7,sw>20?9:8)}px;font-weight:700;color:rgba(255,255,255,.7);white-space:normal;word-break:break-word;text-align:center;overflow:visible;max-height:${h-16}px">${book.title}</span>`:''}
    </div>
    <div style="width:${cw}px;height:${h}px;background:${coverGrad};position:relative;overflow:hidden;box-shadow:2px 2px 0 rgba(0,0,0,.3),4px 5px 0 rgba(0,0,0,.18),6px 10px 20px rgba(0,0,0,.55)">
      ${coverUrl?`<img src="${coverUrl}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">`:''}
      ${!coverUrl?`<div style="position:absolute;inset:0">
        <div style="position:absolute;top:9px;left:5px;right:5px;font-size:8px;opacity:.5;text-transform:uppercase;letter-spacing:.08em;color:#fff">${book.author||''}</div>
        <div style="position:absolute;top:50%;left:5px;right:5px;transform:translateY(-50%);font-size:${tsz}px;font-weight:800;text-align:center;color:#fff;white-space:normal;word-break:break-word">${book.title}</div>
        <div style="position:absolute;bottom:6px;left:5px;right:5px;font-size:8px;opacity:.45;color:#fff;text-align:right">${p} стор.</div>
      </div>`:''}
    </div>
  </div>`;
  return`<div style="width:${vw}px;height:${vh}px;overflow:hidden;margin:0 auto 12px"><div style="width:${sw+cw}px;transform:scale(${scale});transform-origin:top left">${inner}</div></div>`;
}

function _renderBookHTML(book, i, sc=1){
  const p=book.pages||1;
  const h=Math.round(_bookH(p)*sc);
  const sw=Math.round(_spineW(p)*sc);
  const coverUrl=book.coverUrl||null;
  const cw=coverUrl?Math.round(h*2/3):Math.round(_coverW(p)*sc);
  const [top,bot,spine]=_colorFor(book.title);
  const tsz=Math.max(7,Math.round(_titleSz(book.title,cw)*sc));
  const fsz=Math.max(6,Math.round(8*sc));
  const spineGrad=`linear-gradient(90deg,${bot} 0%,${spine} 40%,${top} 100%)`;
  const coverGrad=`linear-gradient(150deg,${top} 0%,${bot} 100%)`;
  const spineText=sw>=10?`<span style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:${Math.max(6,sw>14?Math.round(9*sc):Math.round(8*sc))}px;font-weight:700;color:rgba(255,255,255,.75);white-space:normal;word-break:break-word;text-align:center;overflow:visible;max-height:${h-20}px">${book.title}</span>`:'';
  const textOverlay=!coverUrl?`<div class="book-cover-inner">
    <div style="position:absolute;top:9px;left:5px;right:5px;font-size:${fsz}px;opacity:.5;text-transform:uppercase;letter-spacing:.06em;color:#fff">${book.author||''}</div>
    <div style="position:absolute;top:50%;left:5px;right:5px;transform:translateY(-50%);font-size:${tsz}px;font-weight:800;text-align:center;color:#fff;white-space:normal;word-break:break-word">${book.title}</div>
    <div style="position:absolute;bottom:6px;left:5px;right:5px;font-size:${fsz}px;opacity:.45;color:#fff;text-align:right">${p} стор.</div>
  </div>`:'';
  return`<div class="book-wrap" style="height:${h}px" onclick="openBookDetail(${i})" title="">
    <div class="book-spine" style="width:${sw}px;height:${h}px;background:${spineGrad};box-shadow:inset 2px 0 4px rgba(255,255,255,.06),inset -2px 0 6px rgba(0,0,0,.45),-2px 2px 8px rgba(0,0,0,.55)">${spineText}</div>
    <div class="book-cover" style="width:${cw}px;height:${h}px;background:${coverGrad};box-shadow:2px 2px 0 rgba(0,0,0,.3),3px 4px 0 rgba(0,0,0,.18),5px 8px 16px rgba(0,0,0,.55),inset -3px 0 10px rgba(0,0,0,.22)">
      ${coverUrl?`<img src="${coverUrl}" onerror="this.style.display='none'">`:''}
      ${textOverlay}
      <div class="book-pages-edge"></div>
    </div>
  </div>`;
}

function _buildLibraryHTML(){
  const d=pd();
  const books=d.books||[];
  const totalPages=books.reduce((s,b)=>s+(b.pages||0),0);
  const header=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#7eceff;font-weight:600">Моя Бібліотека</div>
    <div style="font-size:11px;color:#778">${books.length} книг · ${totalPages} стор.</div></div>`;
  if(!books.length){
    return header+`<div style="text-align:center;padding:40px 0;color:#778;font-size:13px;line-height:2">📚<br>Ще немає книжок.<br>Додай першу книгу!</div>`;
  }
  // Fixed 3 shelves by size — each one scrolls sideways instead of spawning new rows.
  const SHELVES=[
    {label:'Менші книги · до 300 стор.',    test:p=>p<300,              cls:'compact'},
    {label:'Середні книги · 300–700 стор.', test:p=>p>=300&&p<700,      cls:''},
    {label:'Цеглини · 700+ стор.',          test:p=>p>=700,             cls:''},
  ];
  const withIdx=[...books].map((b,i)=>({b,i})).reverse(); // newest first within each shelf
  let shelves='';
  SHELVES.forEach(sh=>{
    const items=withIdx.filter(({b})=>sh.test(b.pages||0));
    if(!items.length)return;
    shelves+=`<div class="shelf-row">
      <div class="shelf-label">${sh.label} · ${items.length}</div>
      <div class="shelf-books ${sh.cls}">${items.map(({b,i})=>_renderBookHTML(b,i,0.72)).join('')}</div>
      <div class="shelf-plank"></div>
    </div>`;
  });
  return header+`<div class="shelf-wrap">${shelves}</div>`;
}

let _bdRating=0;
function openBookDetail(i){
  const d=pd();const book=(d.books||[])[i];if(!book)return;
  _bdRating=book.rating||0;
  const [top,bot]=_colorFor(book.title);
  const cw=_coverW(book.pages||1),h=_bookH(book.pages||1);
  const coverHtml=book.coverUrl
    ?`<img src="${book.coverUrl}" style="width:${cw}px;height:${h}px;object-fit:cover;border-radius:4px;display:block;margin:0 auto 10px" onerror="this.style.display='none'">`
    :`<div style="width:${cw}px;height:${h}px;background:linear-gradient(150deg,${top} 0%,${bot} 100%);border-radius:4px;margin:0 auto 10px"></div>`;
  mHTML(`<button onclick="closeModal()" style="position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:18px;color:#7eceff;line-height:1;padding:4px">✕</button>
    ${coverHtml}
    <div class="m-title" style="font-size:15px">${book.title}</div>
    <div style="text-align:center;font-size:12px;color:#aaa;margin-bottom:8px">${book.author||''}</div>
    <div id="bd-stars" style="display:flex;justify-content:center;margin-bottom:8px">${starRatingHTML(_bdRating,true,'onBdStarClick')}</div>
    <div style="text-align:center;font-size:11px;color:#778;margin-bottom:12px">${book.pages} стор. · ${book.date||''}</div>
    <div class="flbl" style="opacity:.6">Жанр</div>
    <select id="bd-genre" class="finput">
      <option value="">Оберіть жанр</option>
      ${GENRES.map(g=>`<option value="${g}" ${book.genre===g?'selected':''}>${g}</option>`).join('')}
    </select>
    <div class="flbl" style="opacity:.6">URL обкладинки</div>
    <input type="url" id="bd-cover-url" class="finput" placeholder="https://…" value="${book.coverUrl||''}" style="font-size:11px">
    <button class="btn-ok" style="width:100%;margin-bottom:8px;padding:12px;font-size:13px" onclick="saveBookDetail(${i})">Зберегти</button>
    <button class="btn-cancel" style="width:100%;padding:12px;font-size:13px" onclick="confirmDeleteBook(${i})">🗑️ Видалити книгу</button>`);
}
function onBdStarClick(event,i){
  _bdRating=i-(_starClickIsHalf(event)?0.5:0);
  document.getElementById('bd-stars').innerHTML=starRatingHTML(_bdRating,true,'onBdStarClick');
}

function saveBookDetail(i){
  const d=pd();const book=(d.books||[])[i];if(!book)return;
  const url=(document.getElementById('bd-cover-url').value||'').trim();
  const genre=document.getElementById('bd-genre').value||'';
  book.coverUrl=url||null;
  if(genre)book.genre=genre;else delete book.genre;
  if(_bdRating)book.rating=_bdRating;else delete book.rating;
  saveToCloud(cur);closeModal();renderLibraryTab();renderAchievementsWidget();renderGeneralStatsWidget();
}

function confirmDeleteBook(i){
  const d=pd();const book=(d.books||[])[i];if(!book)return;
  closeModal(); // openBookDetail's modal is shown via mHTML (outside the qM queue) —
                // must tear it down before queuing this one, or its leftover #mOv
                // stays clickable underneath and a second tap double-fires the delete.
  qM(()=>mEmoji('🗑️','Видалити книжку?',`"${book.title}"\n\nЗабере назад 1📙 і ${book.coinsEarned??coinsForPages(book.pages)}🪙, які вона дала (може піти в мінус, якщо вже витрачено).`,
    [{l:'Видалити',cb:()=>{
      closeModal();
      const coinsToRemove=book.coinsEarned??coinsForPages(book.pages);
      d.bookPoints=(d.bookPoints||0)-1;
      d.coins=(d.coins||0)-coinsToRemove;
      d.booksRead=(d.booksRead||0)-1;
      d.books.splice(i,1);
      renderRes();saveToCloud(cur);renderLibraryTab();
    }},
     {l:'Скасувати',ok:true,cb:closeModal}]));
}

function closeSidePanel(){
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('side-ov').classList.remove('open');
}

async function parseGoodreadsLink(){
  const url=(document.getElementById('sp-goodreads').value||'').trim();
  if(!url){showToast('Встав посилання на Goodreads');return;}
  if(!SCRIPT_URL){showToast('Не налаштовано хмарне збереження — розпізнавання недоступне');return;}
  const btn=document.getElementById('sp-parse-btn');
  btn.disabled=true;btn.textContent='Розпізнаю…';
  const data=await _jsonp(SCRIPT_URL+'?action=parseBook&url='+encodeURIComponent(url));
  btn.disabled=false;btn.textContent='Розпізнати';
  if(!data||data.error){showToast('Не вдалося розпізнати сторінку — заповни вручну');return;}
  if(data.title)document.getElementById('sp-book').value=data.title;
  if(data.author)document.getElementById('sp-author').value=data.author;
  if(data.pages)document.getElementById('sp-pages').value=data.pages;
  if(data.coverUrl)document.getElementById('sp-cover').value=data.coverUrl;
  updSP();
  showToast('Розпізнано! Перевір поля і натисни «Зарахувати книгу»');
}

function updSP(){
  const v=parseInt(document.getElementById('sp-pages').value);
  const el=document.getElementById('sp-prev');
  if(v&&v>0){
    const coins=coinsForPages(v);
    el.style.display='block';
    el.innerHTML=`<div class="ppill">+1📙 &nbsp; +${coins}🪙</div>`;
  } else el.style.display='none';
}

function submitPages(){
  const pages=parseInt(document.getElementById('sp-pages').value);
  const title=(document.getElementById('sp-book').value||'').trim();
  const author=(document.getElementById('sp-author').value||'').trim();
  const coverUrl=(document.getElementById('sp-cover').value||'').trim();
  const genre=document.getElementById('sp-genre').value||'';
  if(!title){showToast('Введи назву книги');return;}
  if(!author){showToast('Введи автора');return;}
  if(!pages||pages<1){showToast('Введи кількість сторінок');return;}
  const d=pd();
  const coins=coinsForPages(pages);
  d.bookPoints=(d.bookPoints||0)+1;
  d.booksRead=(d.booksRead||0)+1;
  d.coins=(d.coins||0)+coins;
  if(!d.books)d.books=[];
  const book={title,author,pages,date:new Date().toLocaleDateString('uk-UA'),ts:Date.now(),coverUrl:coverUrl||null,coinsEarned:coins};
  if(_addBookRating)book.rating=_addBookRating;
  if(genre)book.genre=genre;
  d.books.push(book);
  renderRes();renderActions();renderLibraryTab();renderAchievementsWidget();renderGeneralStatsWidget();closeSidePanel();saveToCloud(cur);
  const preview=_renderBookPreviewHTML(book);
  qM(()=>mHTML(`${preview}<div class="m-title">Книга додана!</div><div class="m-desc" style="text-align:center">+1📙 &nbsp; +${coins}🪙</div><div class="m-btns"><button class="btn-ok" onclick="closeModal()">Вперед!</button></div>`));
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ═══════════ CLOUD SAVE ═══════════
function showSaveStatus(s){
  const el=document.getElementById('save-status');if(!el)return;
  clearTimeout(_saveTimer);
  if(s==='saving'){el.textContent='💾';el.style.color='#fbbf24';el.style.visibility='visible';}
  else if(s==='saved'){el.textContent='✓';el.style.color='#4ade80';el.style.visibility='visible';_saveTimer=setTimeout(()=>el.style.visibility='hidden',2000);}
  else if(s==='error'){el.textContent='⚠️';el.style.color='#ef4444';el.style.visibility='visible';_saveTimer=setTimeout(()=>el.style.visibility='hidden',3500);}
  else{el.style.visibility='hidden';}
}

let _jsonpSeq=0;
function _jsonp(url){
  return new Promise(resolve=>{
    const cb='_rpg'+(++_jsonpSeq);
    const s=document.createElement('script');
    const t=setTimeout(()=>{console.warn('[JSONP] timeout:',url.substring(0,80));delete window[cb];s.remove();resolve(null);},15000);
    window[cb]=d=>{clearTimeout(t);delete window[cb];s.remove();resolve(d);};
    s.onerror=(e)=>{console.error('[JSONP] script error:',e);clearTimeout(t);delete window[cb];s.remove();resolve(null);};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    console.log('[JSONP] →',url.substring(0,120)+'...');
    document.head.appendChild(s);
  });
}

async function saveToCloud(pid){
  if(!pid)return;
  const stateJson=JSON.stringify(state.players[pid]);
  localStorage.setItem('rpg_state_'+pid,stateJson);
  if(!SCRIPT_URL)return;
  showSaveStatus('saving');
  // POST (not GET+JSONP) — a big library of books would otherwise blow past the
  // URL-length limit on a GET request and silently fail to save anything at all.
  try{
    const res=await fetch(SCRIPT_URL,{
      method:'POST',
      body:JSON.stringify({playerId:pid,state:state.players[pid]}),
      headers:{'Content-Type':'text/plain;charset=utf-8'},
    });
    const r=await res.json();
    showSaveStatus(r&&r.ok?'saved':'error');
  }catch(e){
    console.error('[Save] failed:',e);
    showSaveStatus('error');
  }
}

async function loadFromCloud(pid){
  if(!SCRIPT_URL)return null;
  console.log('[Load] player:',pid);
  const d=await _jsonp(SCRIPT_URL+'?action=load&playerId='+encodeURIComponent(pid));
  console.log('[Load] result:',d);
  return(d&&!d.error&&Object.keys(d).length>0)?d:null;
}

// ═══════════ LOC ICONS — individual files ═══════════
function locIconEl(locId,size=64){
  const FILES={oak:'loc_oak.png',pallet:'loc_pallet.png',forest:'loc_forest.png',
               glade:'loc_glade.png',butterfly:'loc_butterfly.png',caves:'loc_caves.png',
               shore:'loc_shore.png',map2:'loc_map2.png'};
  const src=FILES[locId];
  const loc=_anyLoc(locId);
  if(!src) return`<div style="font-size:${Math.round(size*.55)}px;text-align:center;line-height:${size}px;width:${size}px;height:${size}px;margin:0 auto">${loc?loc.emoji:''}</div>`;
  const em=loc?loc.emoji:'?';
  return`<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;margin:0 auto;flex-shrink:0"><img src="${src}" style="width:100%;height:100%;object-fit:cover;object-position:center center;display:block" onerror="this.parentElement.style.cssText+='display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*.55)}px';this.parentElement.textContent='${em}'"></div>`;
}

initState();showSelect();
window.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&cur)
    localStorage.setItem('rpg_state_'+cur,JSON.stringify(state.players[cur]));
});
